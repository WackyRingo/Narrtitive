name: narrative-tracker-scan

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes — 5 min is the fastest GitHub allows
  workflow_dispatch: {}      # lets you trigger a run manually from the Actions tab

concurrency:
  group: narrative-tracker-scan
  cancel-in-progress: false  # queue overlapping runs instead of letting them race

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      # Tracking state now persists via GitHub's own Actions cache instead of a
      # git commit/push — this needs no repo write permission at all, which
      # sidesteps the whole "Workflow permissions" setting that was never
      # confirmed fixed. restore-keys with a prefix always finds the most
      # recent save, even though each run saves under a new, unique key.
      - name: Restore tracking state
        uses: actions/cache/restore@v4
        with:
          path: |
            tracked_tokens.json
            alerted_addresses.json
          key: tracker-state-${{ github.run_id }}
          restore-keys: |
            tracker-state-

      - name: Show restored state
        run: |
          echo "--- tracking files after cache restore ---"
          ls -la tracked_tokens.json alerted_addresses.json 2>&1 || echo "neither file restored yet — expected only on the very first run ever"

      - run: python scan_once.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLANA_TRACKER_API_KEY: ${{ secrets.SOLANA_TRACKER_API_KEY }}

      - name: Save tracking state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            tracked_tokens.json
            alerted_addresses.json
          key: tracker-state-${{ github.run_id }}
