name: narrative-tracker-scan

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes — 5 min is the fastest GitHub allows
  workflow_dispatch: {}      # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: narrative-tracker-scan
  cancel-in-progress: false            # needed so the workflow can commit seen_tokens.json back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python scan_once.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save scanner memory
        run: |
          git config user.name "narrative-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tracked_tokens.json
          git diff --staged --quiet || git commit -m "update tracked tokens"
          git pull --rebase origin main
          if ! git push; then
            echo "::error::Failed to push tracked_tokens.json — tracking state was NOT saved this run. Check repo Settings > Actions > General > Workflow permissions is set to 'Read and write permissions'."
            exit 1
          fi
